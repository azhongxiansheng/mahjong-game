<?xml version="1.0" encoding="UTF-8"?>
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- 微信官方应用图标 (WeChat App Icon)
       Official WeChat Green: #09B83E
       Icon Style: Modern WeChat App Icon with rounded square
  -->
  
  <!-- 圆角方形背景 - 官方微信绿 -->
  <rect x="0" y="0" width="40" height="40" rx="8" ry="8" fill="#09B83E"/>
  
  <!-- 图标组 - 白色微信标志 -->
  <g transform="translate(20, 20)">
    <!-- 主气泡 - 大气泡 -->
    <path d="M -7 -4 L 6 -4 Q 8 -4 8 -2 L 8 5 Q 8 7 6 7 L 1 7 L 2 9 L 0 7 L -7 7 Q -9 7 -9 5 L -9 -2 Q -9 -4 -7 -4 Z" 
          fill="white" opacity="0.9"/>
    
    <!-- 副气泡 - 小气泡 -->
    <ellipse cx="4" cy="-6" rx="2.5" ry="2" fill="white" opacity="0.7"/>
    
    <!-- 用户头像圆圈 - 左侧 -->
    <circle cx="-4" cy="0" r="1.8" fill="white" opacity="0.85"/>
    
    <!-- 用户头像圆圈 - 右侧 -->
    <circle cx="4" cy="0" r="1.8" fill="white" opacity="0.85"/>
    
    <!-- 气泡的嘴角弧线 -->
    <path d="M -4 3 Q 0 5 4 3" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
