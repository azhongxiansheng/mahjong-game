# #255 E7-01 容器化测试拓扑：Control Plane + Redis + STT + Headless Worker。
# 本机主命令（无 compose 插件时；成功退出即四服务 healthy）：
#   docker-compose -f docker-compose.e7.yml --env-file .env.example up -d --build --wait --wait-timeout 900
# Compose V2 等价：
#   docker compose -f docker-compose.e7.yml --env-file .env.example up -d --build --wait --wait-timeout 900
# 清理（删除容器/网络与 STT 模型缓存卷）：
#   docker-compose -f docker-compose.e7.yml --env-file .env.example down -v --remove-orphans
# 宿主端口默认绑定 127.0.0.1；容器间走 compose 网络。
# 网络端到端未验证。不实现 #256 注册/租约/容量。
name: mahjong-e7

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    networks: [e7]
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      HTTP_ADDR: ":8081"
      REDIS_ADDR: "redis:6379"
      TOKEN_SIGNING_SECRET: "${TOKEN_SIGNING_SECRET}"
      # 静态过渡契约：返回给宿主客户端的可达地址（非 worker 容器 DNS）。
      WORKER_ENDPOINT: "${WORKER_ENDPOINT:-ws://127.0.0.1:9000}"
      VOICE_WORKER_ENDPOINT: "${VOICE_WORKER_ENDPOINT:-ws://127.0.0.1:9001}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/readyz"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [e7]
    restart: "no"

  stt:
    build:
      context: ../stt
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      STT_HOST: "0.0.0.0"
      STT_PORT: "9100"
      STT_MODEL: "${STT_MODEL:-small}"
      STT_DEVICE: "${STT_DEVICE:-cpu}"
      STT_COMPUTE_TYPE: "${STT_COMPUTE_TYPE:-int8}"
      STT_MODEL_CACHE: "/var/cache/stt-models"
      # 可选备份；未设置则禁用。不得在日志/PONG 中回显 token。
      STT_NEW_API_ENDPOINT: "${STT_NEW_API_ENDPOINT:-}"
      STT_NEW_API_MODEL: "${STT_NEW_API_MODEL:-}"
      STT_NEW_API_TOKEN: "${STT_NEW_API_TOKEN:-}"
    volumes:
      # 可清理外部缓存卷：down -v 会删除模型缓存。
      - stt_model_cache:/var/cache/stt-models
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "/usr/local/bin/healthcheck_ws.py",
          "--mode",
          "stt",
          "--url",
          "ws://127.0.0.1:9100",
          "--timeout",
          "4",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 300s
    networks: [e7]
    restart: "no"

  worker:
    build:
      context: ../../godot
      dockerfile: server/Dockerfile.headless_worker
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      TOKEN_SIGNING_SECRET: "${TOKEN_SIGNING_SECRET}"
      STT_SERVICE_URL: "ws://stt:9100"
      VOICE_WORKER_PORT: "9001"
      WORKER_BIND_HOST: "0.0.0.0"
      WORKER_PORT: "9000"
    depends_on:
      stt:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "/usr/local/bin/healthcheck_ws.py",
          "--mode",
          "worker",
          "--url",
          "ws://127.0.0.1:9000",
          "--timeout",
          "5",
        ]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 90s
    networks: [e7]
    restart: "no"

volumes:
  stt_model_cache:
    name: mahjong_e7_stt_model_cache

networks:
  e7:
    name: mahjong_e7_net
